name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

jobs:
  server:
    name: Server (CGO_ENABLED=0 Test & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Run Tests (CGO_ENABLED=0)
        run: |
          cd server
          CGO_ENABLED=0 go test -v ./...

      - name: Build Binary
        run: |
          cd server
          CGO_ENABLED=0 go build -v ./cmd/server/...
