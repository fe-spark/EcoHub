name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, for example v0.1.2"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push all-in-one image
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.meta.outputs.stable }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          # Stable: v1.2.3 ; Pre-release: v1.2.3-beta.1 / v1.2.3-rc.1
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          image_base="${REGISTRY}/${owner}/ecohub"
          tags="${image_base}:${version}"
          stable=false
          # Only promote formal releases to :latest (never overwrite with beta/rc).
          if [[ ! "$version" =~ - ]]; then
            stable=true
            tags+=$'\n'"${image_base}:latest"
          fi

          {
            echo "owner=$owner"
            echo "version=$version"
            echo "stable=$stable"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=all-in-one
          cache-to: type=gha,mode=max,scope=all-in-one


  # 正式版镜像推成功后再删 beta。镜像还没上去时不删，避免只剩被清掉的 beta。
  delete-beta:
    name: Delete beta releases and images
    needs: build-and-push
    if: needs.build-and-push.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Delete beta releases, tags, and images
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/delete-beta.sh
