name: GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - docs/RELEASE.md
      - web/package.json
      - .github/workflows/github-release.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, for example v1.0.0"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="v$(node -p "require('./web/package.json').version")"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null
          ls_rc=$?
          set -e

          if [ "$ls_rc" -eq 0 ]; then
            git fetch --force origin "refs/tags/$version:refs/tags/$version"
          elif [ "$ls_rc" -eq 2 ]; then
            if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$version" -m "$version"
            fi
            if ! git push origin "refs/tags/$version"; then
              git fetch --force origin "refs/tags/$version:refs/tags/$version"
            fi
          else
            echo "Failed to query remote tags for $version" >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag still missing: $version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" =~ - ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          extra_flags=()
          if [ "$PRERELEASE" = "true" ]; then
            extra_flags+=(--prerelease)
          else
            extra_flags+=(--latest)
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --title "$VERSION" \
              --notes-file docs/RELEASE.md \
              "${extra_flags[@]}"
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file docs/RELEASE.md \
              "${extra_flags[@]}"
          fi

      # GITHUB_TOKEN 推 tag / 发 release 不会触发其他 workflow。
      # --ref 用版本 tag，dispatch 的 headBranch 才是 vX.Y.Z，才能和 push:tags 对上、避免重跑漏构建。
      - name: Dispatch Docker release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          runs=$(gh run list --workflow=docker-release.yml --limit 30 --json status,conclusion,headBranch)
          covered=$(printf '%s' "$runs" | jq -r --arg v "$VERSION" '
            any(.[]; .headBranch == $v and (
              .status == "in_progress" or
              .status == "queued" or
              .status == "waiting" or
              .status == "pending" or
              .status == "requested" or
              .conclusion == "success"
            ))
          ')
          if [ "$covered" = "true" ]; then
            echo "Docker Release already running or succeeded for $VERSION"
            exit 0
          fi
          gh workflow run docker-release.yml --ref "$VERSION" -f version="$VERSION"
