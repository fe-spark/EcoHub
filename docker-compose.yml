services:
  mysql:
    container_name: Eco-mysql
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ecohub}
      MYSQL_DATABASE: ${MYSQL_DBNAME:-eco}
      MYSQL_USER: ${MYSQL_USER:-eco}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecohub}
    volumes:
      - eco-mysql-data:/var/lib/mysql
    # 仅本机映射，方便宿主机 go run 本地开发；全容器部署仍走 Eco-network 服务名
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - Eco-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    container_name: Eco-redis
    image: redis:7.4-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ecohub}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-ecohub}"]
    volumes:
      - eco-redis-data:/data
    # 仅本机映射，方便宿主机 go run 本地开发；全容器部署仍走 Eco-network 服务名
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - Eco-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    container_name: Eco-web
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_URL: http://server:${SERVER_PORT:-8080}
    environment:
      API_URL: http://server:${SERVER_PORT:-8080}
    restart: always
    ports:
      - ${WEB_PUBLIC_PORT:-3000}:3000
    networks:
      - Eco-network
    depends_on:
      server:
        condition: service_healthy

  server:
    container_name: Eco-server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-ecohub_2026!local@dev_secret$$001}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-eco}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecohub}
      MYSQL_DBNAME: ${MYSQL_DBNAME:-eco}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ecohub}
      REDIS_DB: ${REDIS_DB:-0}
      # Telegram / 通用代理（可选；空值表示未配置）
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      # 采集写阀（可选；未设或空则服务端用默认）
      COLLECT_WRITE_MAX_INFLIGHT: ${COLLECT_WRITE_MAX_INFLIGHT:-}
      COLLECT_WRITE_PAGES_PER_SEC: ${COLLECT_WRITE_PAGES_PER_SEC:-}
      COLLECT_WRITE_BURST_PAGES: ${COLLECT_WRITE_BURST_PAGES:-}
      COLLECT_WRITE_PENDING_PER_SOURCE: ${COLLECT_WRITE_PENDING_PER_SOURCE:-}
      COLLECT_WRITE_PENDING_GLOBAL: ${COLLECT_WRITE_PENDING_GLOBAL:-}
      COLLECT_STATS_FLUSH_INTERVAL_SEC: ${COLLECT_STATS_FLUSH_INTERVAL_SEC:-}
      COLLECT_CACHE_FLUSH_INTERVAL_SEC: ${COLLECT_CACHE_FLUSH_INTERVAL_SEC:-}
      COLLECT_PROGRESS_RETAIN_SEC: ${COLLECT_PROGRESS_RETAIN_SEC:-}
      COLLECT_PROGRESS_STALE_SEC: ${COLLECT_PROGRESS_STALE_SEC:-}
    ports:
      - 0.0.0.0:${SERVER_PUBLIC_PORT:-18080}:${SERVER_PORT:-8080}
    networks:
      - Eco-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:$${PORT}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  Eco-network:
    driver: bridge

volumes:
  eco-mysql-data:
  eco-redis-data:
